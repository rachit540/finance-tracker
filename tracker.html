<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6c5ce7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Finance Tracker</title>
<style>
  :root {
    --bg: #f0f2f8;
    --card: #ffffff;
    --text: #1e2749;
    --text-light: #8a94b0;
    --input-bg: #f8f9fc;
    --chip-bg: #f0f2f8;
    --track: #eceef5;
    --primary: #6c5ce7;
    --primary-light: #a29bfe;
    --green: #00b894;
    --red: #e17055;
    --shadow: 0 4px 20px rgba(30, 39, 73, 0.08);
    --radius: 20px;
    --nav-h: 74px;
  }

  body.dark {
    --bg: #0f1120;
    --card: #1a1d30;
    --text: #eef0f8;
    --text-light: #767f9e;
    --input-bg: #23263c;
    --chip-bg: #23263c;
    --track: #2a2e48;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: calc(var(--nav-h) + 24px);
    transition: background 0.3s, color 0.3s;
  }

  /* ===== Screens ===== */
  .screen { display: none; }
  .screen.active { display: block; animation: screenIn 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(16px) scale(0.99); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ===== Headers ===== */
  .page-header {
    position: relative;
    padding: 26px 20px 54px;
    border-radius: 0 0 34px 34px;
    color: white;
    overflow: hidden;
  }
  .page-header::before, .page-header::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    opacity: 0.25;
  }
  .page-header::before {
    width: 160px; height: 160px;
    background: white;
    top: -70px; right: -50px;
  }
  .page-header::after {
    width: 90px; height: 90px;
    background: white;
    bottom: -30px; left: -30px;
  }
  .purple { background: linear-gradient(135deg, #6c5ce7, #8e7cf3); }
  .green-h { background: linear-gradient(135deg, #00b894, #55efc4); }
  .orange { background: linear-gradient(135deg, #e17055, #fab1a0); }
  .page-header h1 { font-size: 19px; font-weight: 700; position: relative; z-index: 1; }

  /* ===== Home ===== */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    position: relative;
    z-index: 1;
  }
  .greeting { font-size: 13px; opacity: 0.85; }
  .app-name { font-size: 19px; font-weight: 700; }
  .theme-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.18);
    font-size: 19px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .theme-btn:active { transform: scale(0.85) rotate(-20deg); }

  .balance-card {
    background: rgba(255,255,255,0.16);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    z-index: 1;
  }
  .balance-label { font-size: 14px; opacity: 0.9; margin-bottom: 4px; }
  .balance-amount { font-size: 40px; font-weight: 800; letter-spacing: -0.5px; transition: color 0.3s; }
  .mini-stats { display: flex; gap: 12px; margin-top: 18px; }
  .mini-stat {
    flex: 1;
    background: rgba(255,255,255,0.13);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .mini-stat .label { font-size: 12px; opacity: 0.85; display: flex; align-items: center; gap: 5px; }
  .mini-stat .label .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-green { background: #55efc4; }
  .dot-red { background: #fab1a0; }
  .mini-stat .value { font-size: 18px; font-weight: 700; margin-top: 4px; }

  .container { padding: 0 16px; }

  .section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 24px 2px 12px;
  }
  .section-title h3 { font-size: 16px; }
  .section-title .link-btn {
    border: none;
    background: none;
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    padding: 4px;
  }

  /* ===== Transaction Item ===== */
  .txn-list { display: flex; flex-direction: column; gap: 10px; }
  .txn-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border-radius: 16px;
    padding: 14px;
    box-shadow: var(--shadow);
    animation: slideUp 0.35s ease both;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .txn-icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .txn-icon.expense { background: #fdeee9; }
  .txn-icon.income { background: #e6f9f4; }
  body.dark .txn-icon.expense { background: rgba(225,112,85,0.18); }
  body.dark .txn-icon.income { background: rgba(0,184,148,0.18); }
  .txn-details { flex: 1; min-width: 0; }
  .txn-title { font-size: 15px; font-weight: 600; }
  .txn-sub { font-size: 12px; color: var(--text-light); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .txn-amount { text-align: right; flex-shrink: 0; }
  .txn-amount .amt { font-size: 16px; font-weight: 700; }
  .amt.expense { color: var(--red); }
  .amt.income { color: var(--green); }
  .txn-amount .date { font-size: 11px; color: var(--text-light); margin-top: 2px; }
  .del-btn {
    width: 34px; height: 34px;
    border: none; border-radius: 10px;
    background: #fdeee9; color: var(--red);
    font-size: 15px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s;
  }
  body.dark .del-btn { background: rgba(225,112,85,0.18); }
  .del-btn:active { transform: scale(0.85); }

  /* ===== Day groups (History) ===== */
  .day-group { margin-bottom: 18px; }
  .day-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-light);
    margin: 4px 2px 8px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .day-head .day-total { font-weight: 700; }
  .day-total.expense { color: var(--red); }
  .day-total.income { color: var(--green); }

  /* ===== Empty state ===== */
  .empty-state {
    text-align: center;
    padding: 44px 20px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .empty-state .emoji { font-size: 50px; margin-bottom: 12px; display: inline-block; animation: bounce 2s infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .empty-state p { color: var(--text-light); font-size: 15px; line-height: 1.6; }

  /* ===== ADD screen ===== */
  .type-toggle {
    display: flex;
    background: var(--card);
    border-radius: 18px;
    padding: 6px;
    margin-top: -28px;
    position: relative;
    z-index: 2;
    box-shadow: var(--shadow);
  }
  .type-toggle button {
    flex: 1;
    padding: 15px;
    border: none;
    background: transparent;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .type-toggle button.active-expense { background: var(--red); color: white; box-shadow: 0 4px 14px rgba(225,112,85,0.4); }
  .type-toggle button.active-income { background: var(--green); color: white; box-shadow: 0 4px 14px rgba(0,184,148,0.4); }

  .add-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px 18px;
    margin-top: 16px;
    box-shadow: var(--shadow);
  }

  .q-label { font-size: 16px; font-weight: 700; margin-bottom: 12px; text-align: center; }
  .amount-input-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--input-bg);
    border: 2px solid var(--track);
    border-radius: 18px;
    padding: 10px 20px;
    margin-bottom: 20px;
    transition: border 0.2s;
  }
  .amount-input-wrap:focus-within { border-color: var(--primary); }
  .amount-input-wrap .currency { font-size: 30px; font-weight: 800; color: var(--primary); margin-right: 10px; }
  #amount {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 34px;
    font-weight: 800;
    padding: 8px 0;
    outline: none;
    color: var(--text);
    min-width: 0;
  }
  #amount::placeholder { color: var(--text-light); opacity: 0.5; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center; }
  .chip {
    padding: 13px 17px;
    background: var(--chip-bg);
    border: 2px solid transparent;
    border-radius: 24px;
    font-size: 15px;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow);
  }
  .chip:active { transform: scale(0.92); }
  .chip.selected {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(108,92,231,0.4);
  }

  .note-date-row { display: flex; gap: 8px; margin-bottom: 20px; }
  #note {
    flex: 1;
    padding: 15px;
    border: 2px solid var(--track);
    border-radius: 14px;
    font-size: 15px;
    outline: none;
    background: var(--input-bg);
    color: var(--text);
    transition: border 0.2s;
  }
  #date {
    padding: 15px 8px;
    border: 2px solid var(--track);
    border-radius: 14px;
    font-size: 13px;
    outline: none;
    color: var(--text);
    background: var(--input-bg);
    width: 138px;
  }
  #note:focus, #date:focus { border-color: var(--primary); }

  .big-btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, #6c5ce7, #8e7cf3);
    color: white;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s ease;
    box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4);
  }
  .big-btn:active { transform: scale(0.96); }
  .big-btn.green { background: linear-gradient(135deg, #00b894, #55efc4); box-shadow: 0 8px 20px rgba(0,184,148,0.4); }

  /* ===== BUDGET screen ===== */
  .budget-hero {
    background: var(--card);
    border-radius: var(--radius);
    padding: 26px 20px;
    box-shadow: var(--shadow);
    margin-top: 16px;
    text-align: center;
  }
  .ring-wrap { position: relative; width: 180px; height: 180px; margin: 0 auto; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .ring-center .mood { font-size: 30px; }
  .ring-center .pct { font-size: 26px; font-weight: 800; margin-top: 2px; }
  .ring-center .pct-lbl { font-size: 11px; color: var(--text-light); }
  .budget-amount-line { margin-top: 18px; }
  .budget-big-amt { font-size: 30px; font-weight: 800; }
  .budget-sub { font-size: 13px; color: var(--text-light); margin-top: 3px; }
  .budget-msg {
    font-size: 15px;
    font-weight: 700;
    padding: 14px;
    border-radius: 14px;
    margin-top: 16px;
  }
  .budget-msg.ok { background: #e6f9f4; color: #00a381; }
  .budget-msg.warn { background: #fff5e0; color: #d69e00; }
  .budget-msg.over { background: #fdeee9; color: #d35f45; }
  body.dark .budget-msg.ok { background: rgba(0,184,148,0.15); }
  body.dark .budget-msg.warn { background: rgba(253,203,110,0.15); }
  body.dark .budget-msg.over { background: rgba(225,112,85,0.15); }

  .budget-setup input {
    width: 100%;
    padding: 17px;
    border: 2px solid var(--track);
    border-radius: 16px;
    font-size: 22px;
    font-weight: 800;
    outline: none;
    background: var(--input-bg);
    color: var(--text);
    text-align: center;
    transition: border 0.2s;
    margin-bottom: 14px;
  }
  .budget-setup input:focus { border-color: var(--primary); }

  /* ===== HISTORY filter ===== */
  .history-filter {
    display: flex;
    gap: 8px;
    margin: 16px 0;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .filter-chip {
    padding: 11px 18px;
    background: var(--card);
    border: 2px solid var(--track);
    border-radius: 22px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    box-shadow: var(--shadow);
    transition: all 0.2s;
  }
  .filter-chip.selected { background: var(--primary); border-color: var(--primary); color: white; }
  .filter-chip:active { transform: scale(0.93); }

  /* ===== Backup Card ===== */
  .backup-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px;
    margin: 24px 0 8px;
    box-shadow: var(--shadow);
  }
  .backup-card p {
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 12px;
    text-align: center;
  }
  .backup-btns { display: flex; gap: 10px; }
  .backup-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .backup-btn:active { transform: scale(0.95); }
  .backup-btn.out { background: #ede9fe; color: var(--primary); }
  .backup-btn.in { background: #e6f9f4; color: var(--green); }
  body.dark .backup-btn.out { background: rgba(108,92,231,0.2); }
  body.dark .backup-btn.in { background: rgba(0,184,148,0.2); }

  /* ===== Bottom Nav ===== */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    height: var(--nav-h);
    background: var(--card);
    display: flex;
    align-items: center;
    box-shadow: 0 -6px 24px rgba(30, 39, 73, 0.12);
    z-index: 50;
  }
  .nav-btn {
    flex: 1;
    height: 100%;
    border: none;
    background: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    color: var(--text-light);
    transition: color 0.2s, transform 0.15s;
  }
  .nav-btn .icon { font-size: 25px; transition: transform 0.2s; }
  .nav-btn .lbl { font-size: 11px; font-weight: 700; }
  .nav-btn.active { color: var(--primary); }
  .nav-btn.active .icon { transform: translateY(-2px) scale(1.15); }
  .nav-btn:active { transform: scale(0.9); }

  .nav-fab {
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 5px solid var(--bg);
    background: linear-gradient(135deg, #6c5ce7, #8e7cf3);
    color: white;
    font-size: 26px;
    margin-top: -34px;
    box-shadow: 0 10px 22px rgba(108,92,231,0.45);
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    flex-shrink: 0;
    position: relative;
    z-index: 51;
  }
  .nav-fab:active { transform: scale(0.88) rotate(90deg); }

  /* ===== Confetti ===== */
  .confetti {
    position: fixed;
    top: -16px;
    width: 10px; height: 14px;
    border-radius: 3px;
    z-index: 200;
    animation: fall linear forwards;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(720deg); opacity: 0.2; }
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: calc(var(--nav-h) + 24px);
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text);
    color: var(--bg);
    padding: 14px 26px;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 700;
    box-shadow: 0 10px 28px rgba(0,0,0,0.3);
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    z-index: 100;
    pointer-events: none;
    max-width: 88%;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<!-- ============ SCREEN 1: HOME ============ -->
<div class="screen active" id="screen-home">
  <div class="page-header purple">
    <div class="header-top">
      <div>
        <div class="greeting" id="greeting">Hello! 👋</div>
        <div class="app-name">💰 My Tracker</div>
      </div>
      <button class="theme-btn" id="themeBtn">🌙</button>
    </div>
    <div class="balance-card">
      <div class="balance-label">My Balance</div>
      <div class="balance-amount" id="balance">₹0</div>
      <div class="mini-stats">
        <div class="mini-stat">
          <div class="label"><span class="dot dot-green"></span>Income</div>
          <div class="value" id="totalIncome">₹0</div>
        </div>
        <div class="mini-stat">
          <div class="label"><span class="dot dot-red"></span>Expense</div>
          <div class="value" id="totalExpense">₹0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="section-title">
      <h3>⏰ Recent</h3>
      <button class="link-btn" onclick="goTo('history')">View All →</button>
    </div>
    <div class="txn-list" id="recentList"></div>

    <!-- Backup -->
    <div class="backup-card">
      <p>💾 Backup before switching phones!<br>Send the file to yourself on Google Drive / WhatsApp.</p>
      <div class="backup-btns">
        <button class="backup-btn out" id="backupBtn">📤 Backup</button>
        <button class="backup-btn in" id="restoreBtn">📥 Restore</button>
      </div>
      <input type="file" id="restoreFile" accept=".json" style="display:none">
    </div>
  </div>
</div>

<!-- ============ SCREEN 2: ADD ============ -->
<div class="screen" id="screen-add">
  <div class="page-header purple" style="padding-bottom: 46px;">
    <h1>➕ What happened?</h1>
  </div>

  <div class="container">
    <div class="type-toggle">
      <button type="button" id="btnExpense" class="active-expense">− Expense</button>
      <button type="button" id="btnIncome">+ Income</button>
    </div>

    <div class="add-card">
      <div class="q-label">How much?</div>
      <div class="amount-input-wrap">
        <span class="currency">₹</span>
        <input type="number" id="amount" placeholder="0" min="0" step="0.01" inputmode="decimal">
      </div>

      <div class="q-label" id="chipLabel">Where did it go?</div>
      <div class="chips" id="chips"></div>

      <div class="note-date-row">
        <input type="text" id="note" placeholder="Add a note (optional)">
        <input type="date" id="date">
      </div>

      <button class="big-btn" id="saveBtn">✅ Save Expense</button>
    </div>
  </div>
</div>

<!-- ============ SCREEN 3: BUDGET ============ -->
<div class="screen" id="screen-budget">
  <div class="page-header green-h">
    <h1>🎯 My Budget</h1>
  </div>

  <div class="container">
    <div class="budget-hero" id="budgetBody"></div>
  </div>
</div>

<!-- ============ SCREEN 4: HISTORY ============ -->
<div class="screen" id="screen-history">
  <div class="page-header orange">
    <h1>📋 All Transactions</h1>
  </div>

  <div class="container">
    <div class="history-filter" id="historyFilter"></div>
    <div id="fullList"></div>
  </div>
</div>

<!-- ============ BOTTOM NAV ============ -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-screen="home">
    <span class="icon">🏠</span><span class="lbl">Home</span>
  </button>
  <button class="nav-fab" data-screen="add">➕</button>
  <button class="nav-btn" data-screen="budget">
    <span class="icon">🎯</span><span class="lbl">Budget</span>
  </button>
  <button class="nav-btn" data-screen="history">
    <span class="icon">📋</span><span class="lbl">All</span>
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
  const EXPENSE_CATS = ['🍛 Food', '🚌 Travel', '🛒 Shopping', '🏠 Rent', '📱 Recharge', '💊 Health', '🎬 Fun', '📦 Other'];
  const INCOME_CATS = ['💼 Salary', '🎁 Gift', '📈 Extra', '📥 Refund', '📦 Other'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const RING_C = 2 * Math.PI * 70;

  let currentType = 'expense';
  let selectedCategory = null;
  let historyFilter = 'all';

  let transactions = JSON.parse(localStorage.getItem('myFinanceTxns')) || [];
  let budget = parseFloat(localStorage.getItem('myFinanceBudget')) || 0;
  let dark = localStorage.getItem('myFinanceDark') === '1';

  // ===== Helpers =====
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function todayStr(offset = 0) {
    return new Date(Date.now() - offset * 86400000).toISOString().split('T')[0];
  }

  function fmtDate(d) {
    const [y, m, day] = d.split('-');
    return day + ' ' + months[parseInt(m) - 1];
  }

  function dayLabel(d) {
    if (d === todayStr()) return 'Today';
    if (d === todayStr(1)) return 'Yesterday';
    return fmtDate(d);
  }

  function catEmoji(cat) {
    if (!cat) return currentType === 'expense' ? '💸' : '💰';
    return cat.split(' ')[0];
  }
  function catName(cat) {
    if (!cat) return 'General';
    return cat.split(' ').slice(1).join(' ');
  }

  function monthExpenses() {
    const n = new Date();
    const prefix = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0');
    return transactions
      .filter(t => t.type === 'expense' && t.date.startsWith(prefix))
      .reduce((s, t) => s + t.amount, 0);
  }

  // ===== Confetti =====
  function confetti() {
    const colors = ['#6c5ce7', '#00b894', '#fdcb6e', '#e17055', '#74b9ff', '#a29bfe'];
    for (let i = 0; i < 36; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (30 + Math.random() * 40) + '%';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDelay = (Math.random() * 0.25) + 's';
      c.style.animationDuration = (0.9 + Math.random() * 0.9) + 's';
      c.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 2200);
    }
  }

  // ===== Greeting =====
  function setGreeting() {
    const h = new Date().getHours();
    let g;
    if (h >= 5 && h < 12) g = 'Good morning! ☀️';
    else if (h >= 12 && h < 17) g = 'Good afternoon! 🌤️';
    else if (h >= 17 && h < 21) g = 'Good evening! 🌆';
    else g = 'Good night! 🌙';
    document.getElementById('greeting').textContent = g + ' Hello!';
  }

  // ===== Dark mode =====
  function applyDark() {
    document.body.classList.toggle('dark', dark);
    document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
  }
  document.getElementById('themeBtn').onclick = function() {
    dark = !dark;
    localStorage.setItem('myFinanceDark', dark ? '1' : '0');
    applyDark();
  };

  // ===== Navigation =====
  function goTo(screen) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + screen).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.screen === screen);
    });
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('.nav-btn, .nav-fab').forEach(b => {
    b.onclick = () => goTo(b.dataset.screen);
  });

  // ===== Save =====
  function save() {
    localStorage.setItem('myFinanceTxns', JSON.stringify(transactions));
    renderAll();
  }

  // ===== Renders =====
  function txnItemHTML(tx, index) {
    const isExpense = tx.type === 'expense';
    return `
      <div class="txn-item">
        <div class="txn-icon ${tx.type}">${catEmoji(tx.category)}</div>
        <div class="txn-details">
          <div class="txn-title">${catName(tx.category)}</div>
          <div class="txn-sub">${tx.note || 'No note'}</div>
        </div>
        <div class="txn-amount">
          <div class="amt ${tx.type}">${isExpense ? '−' : '+'} ₹${tx.amount.toLocaleString('en-IN')}</div>
          <div class="date">${fmtDate(tx.date)}</div>
        </div>
        <button class="del-btn" onclick="deleteTxn(${index})">✕</button>
      </div>`;
  }

  function renderAll() {
    renderHome();
    renderBudget();
    renderHistory();
  }

  function renderHome() {
    let totalInc = 0, totalExp = 0;
    transactions.forEach(t => {
      if (t.type === 'expense') totalExp += t.amount; else totalInc += t.amount;
    });

    const bal = totalInc - totalExp;
    const balanceEl = document.getElementById('balance');
    balanceEl.textContent = '₹' + bal.toLocaleString('en-IN');
    balanceEl.style.color = bal >= 0 ? '#55efc4' : '#fab1a0';
    document.getElementById('totalIncome').textContent = '₹' + totalInc.toLocaleString('en-IN');
    document.getElementById('totalExpense').textContent = '₹' + totalExp.toLocaleString('en-IN');

    const recentEl = document.getElementById('recentList');
    if (transactions.length === 0) {
      recentEl.innerHTML = `
        <div class="empty-state">
          <div class="emoji">🪙</div>
          <p>Nothing here yet!<br>Tap the ➕ below to add<br>your first expense 😊</p>
        </div>`;
    } else {
      recentEl.innerHTML = transactions.slice(-3).reverse()
        .map((tx, i) => txnItemHTML(tx, transactions.length - 1 - i))
        .join('');
    }
  }

  function renderBudget() {
    const body = document.getElementById('budgetBody');
    const spent = monthExpenses();

    if (!budget) {
      body.innerHTML = `
        <div class="ring-wrap" style="height:auto; width:100%;">
          <div style="font-size:52px; margin-bottom: 10px;">🎯</div>
        </div>
        <p class="budget-sub" style="margin-bottom:18px; font-size:15px;">
          How much will you spend this month?<br>Set a limit and we'll keep you on track!
        </p>
        <div class="budget-setup">
          <input type="number" id="budgetInput" placeholder="₹ e.g. 5000" inputmode="decimal">
          <button class="big-btn green" id="setBudgetBtn">🎯 Set Budget</button>
        </div>`;
      document.getElementById('setBudgetBtn').onclick = function() {
        const val = parseFloat(document.getElementById('budgetInput').value);
        if (!val || val <= 0) { showToast('⚠️ Enter a valid amount!'); return; }
        budget = val;
        localStorage.setItem('myFinanceBudget', budget);
        showToast('🎯 Budget set!');
        confetti();
        renderAll();
      };
      return;
    }

    const pct = Math.min((spent / budget) * 100, 100);
    const remaining = budget - spent;
    const barClass = pct >= 100 ? 'over' : pct >= 75 ? 'warn' : 'ok';
    const mood = pct >= 100 ? '😰' : pct >= 75 ? '😟' : '😊';
    const ringColor = pct >= 100 ? '#e17055' : pct >= 75 ? '#fdcb6e' : '#00b894';

    let msgHTML;
    if (remaining >= 0) {
      msgHTML = `<div class="budget-msg ${barClass}">💰 You can still spend ₹${remaining.toLocaleString('en-IN')}!</div>`;
    } else {
      msgHTML = `<div class="budget-msg over">🔴 You're ₹${Math.abs(remaining).toLocaleString('en-IN')} over budget!</div>`;
    }

    body.innerHTML = `
      <div class="ring-wrap">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <circle cx="90" cy="90" r="70" fill="none" stroke="var(--track)" stroke-width="16"/>
          <circle id="ringBar" cx="90" cy="90" r="70" fill="none" stroke="${ringColor}"
            stroke-width="16" stroke-linecap="round"
            stroke-dasharray="${RING_C}" stroke-dashoffset="${RING_C}"
            style="transition: stroke-dashoffset 0.8s cubic-bezier(0.22, 1, 0.36, 1);"/>
        </svg>
        <div class="ring-center">
          <div class="mood">${mood}</div>
          <div class="pct" style="color:${ringColor}">${Math.round(pct)}%</div>
          <div class="pct-lbl">spent</div>
        </div>
      </div>
      <div class="budget-amount-line">
        <div class="budget-big-amt">₹${spent.toLocaleString('en-IN')}</div>
        <div class="budget-sub">spent this month of ₹${budget.toLocaleString('en-IN')} limit</div>
      </div>
      ${msgHTML}
      <button class="link-btn" style="margin-top:16px; border:none; background:none; color:var(--primary); font-weight:700; cursor:pointer;" id="changeBudgetBtn">✏️ Change budget?</button>`;

    document.getElementById('changeBudgetBtn').onclick = function() {
      if (confirm('Change budget?')) {
        budget = 0;
        localStorage.removeItem('myFinanceBudget');
        renderBudget();
      }
    };

    requestAnimationFrame(() => {
      const bar = document.getElementById('ringBar');
      if (bar) bar.style.strokeDashoffset = RING_C * (1 - pct / 100);
    });
  }

  function renderHistory() {
    const filters = [
      { id: 'all', label: 'All' },
      { id: 'expense', label: '− Expense' },
      { id: 'income', label: '+ Income' }
    ];
    const filterEl = document.getElementById('historyFilter');
    filterEl.innerHTML = filters.map(f =>
      `<button class="filter-chip${historyFilter === f.id ? ' selected' : ''}" data-f="${f.id}">${f.label}</button>`
    ).join('');
    filterEl.querySelectorAll('.filter-chip').forEach(chip => {
      chip.onclick = () => {
        historyFilter = chip.dataset.f;
        renderHistory();
      };
    });

    const listEl = document.getElementById('fullList');
    const filtered = transactions
      .map((tx, i) => ({ tx, i }))
      .filter(({ tx }) => historyFilter === 'all' || tx.type === historyFilter);

    if (filtered.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="emoji">🔍</div>
          <p>Nothing found here!</p>
        </div>`;
      return;
    }

    // Group by date
    const groups = {};
    filtered.forEach(({ tx, i }) => {
      if (!groups[tx.date]) groups[tx.date] = [];
      groups[tx.date].push({ tx, i });
    });

    const dates = Object.keys(groups).sort().reverse();
    listEl.innerHTML = dates.map(date => {
      const items = groups[date];
      let dayExp = 0, dayInc = 0;
      items.forEach(({ tx }) => {
        if (tx.type === 'expense') dayExp += tx.amount; else dayInc += tx.amount;
      });
      const dayTotal = dayInc - dayExp;
      const totalCls = dayTotal >= 0 ? 'income' : 'expense';
      const totalSign = dayTotal >= 0 ? '+' : '−';
      return `
        <div class="day-group">
          <div class="day-head">
            <span>📅 ${dayLabel(date)}</span>
            <span class="day-total ${totalCls}">${totalSign} ₹${Math.abs(dayTotal).toLocaleString('en-IN')}</span>
          </div>
          <div class="txn-list">
            ${items.reverse().map(({ tx, i }) => txnItemHTML(tx, i)).join('')}
          </div>
        </div>`;
    }).join('');
  }

  // ===== Delete =====
  window.deleteTxn = function(i) {
    if (confirm('Delete this?')) {
      transactions.splice(i, 1);
      save();
      showToast('🗑️ Deleted');
    }
  };

  // ===== Add screen =====
  const btnExpense = document.getElementById('btnExpense');
  const btnIncome = document.getElementById('btnIncome');

  function setType(type) {
    currentType = type;
    btnExpense.className = type === 'expense' ? 'active-expense' : '';
    btnIncome.className = type === 'income' ? 'active-income' : '';
    selectedCategory = null;
    document.getElementById('chipLabel').textContent = type === 'expense' ? 'Where did it go?' : 'Where did it come from?';
    document.getElementById('saveBtn').textContent = type === 'expense' ? '✅ Save Expense' : '✅ Save Income';
    renderChips();
  }
  btnExpense.onclick = () => setType('expense');
  btnIncome.onclick = () => setType('income');

  function renderChips() {
    const wrap = document.getElementById('chips');
    const cats = currentType === 'expense' ? EXPENSE_CATS : INCOME_CATS;
    wrap.innerHTML = '';
    cats.forEach(cat => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (selectedCategory === cat ? ' selected' : '');
      chip.textContent = cat;
      chip.onclick = () => {
        selectedCategory = selectedCategory === cat ? null : cat;
        renderChips();
      };
      wrap.appendChild(chip);
    });
  }

  document.getElementById('saveBtn').onclick = function() {
    const amountInput = document.getElementById('amount');
    const amount = parseFloat(amountInput.value);

    if (!amount || amount <= 0) {
      showToast('⚠️ Enter amount first!');
      amountInput.focus();
      return;
    }

    const tx = {
      amount: amount,
      type: currentType,
      category: selectedCategory || null,
      note: document.getElementById('note').value.trim(),
      date: document.getElementById('date').value || new Date().toISOString().split('T')[0]
    };

    transactions.push(tx);
    save();
    amountInput.value = '';
    document.getElementById('note').value = '';
    selectedCategory = null;
    renderChips();

    let msg = '✅ Saved!';
    if (tx.type === 'expense' && budget) {
      const spent = monthExpenses();
      const prev = spent - tx.amount;
      if (prev < budget && spent >= budget) {
        msg = '🚨 Budget crossed! ₹' + (spent - budget).toLocaleString('en-IN') + ' over!';
      } else if (prev < budget * 0.75 && spent >= budget * 0.75) {
        msg = '⚠️ Over 75% of budget used!';
      }
    }
    showToast(msg);
    confetti();
    setTimeout(() => goTo('home'), 700);
  };

  // ===== Backup & Restore =====
  document.getElementById('backupBtn').onclick = function() {
    if (transactions.length === 0) {
      showToast('⚠️ Add some transactions first!');
      return;
    }
    const data = {
      app: 'my-finance-tracker',
      version: 1,
      exported: new Date().toISOString(),
      budget: budget,
      transactions: transactions
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'finance-backup-' + todayStr() + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('📤 Backup downloaded!');
  };

  document.getElementById('restoreBtn').onclick = function() {
    document.getElementById('restoreFile').click();
  };

  document.getElementById('restoreFile').onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.transactions || !Array.isArray(data.transactions)) {
          showToast('⚠️ Invalid backup file!');
          return;
        }
        if (confirm('This backup has ' + data.transactions.length + ' transactions.\nCurrent data will be replaced. Continue?')) {
          transactions = data.transactions;
          if (data.budget) {
            budget = parseFloat(data.budget);
            localStorage.setItem('myFinanceBudget', budget);
          }
          save();
          confetti();
          showToast('📥 All data restored!');
        }
      } catch (err) {
        showToast('⚠️ Could not read the file!');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  // ===== Init =====
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  document.getElementById('date').valueAsDate = new Date();
  setGreeting();
  applyDark();
  setType('expense');
  renderAll();
</script>

</body>
</html>
